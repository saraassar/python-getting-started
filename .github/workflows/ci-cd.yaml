name: Python CI/CD

on:
  push:
    branches:
      - test

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/saraassar/python-getting-started

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect Static Files
        run: |
          python manage.py collectstatic --noinput

      - name: Run Django Tests
        run: |
          python manage.py test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Image Tag
        run: |
          echo "IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          docker build \
            -t ${IMAGE_NAME}:${IMAGE_TAG} \
            .

      - name: Push Docker Image
        run: |
          docker push ${IMAGE_NAME}:${IMAGE_TAG}

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm values.yaml
        run: |
          yq -i '.image.tag = env(IMAGE_TAG)' helm-pyhton/values.yaml

      - name: Show Updated values.yaml
        run: |
          cat helm-pyhton/values.yaml

      - name: Commit Updated values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm-pyhton/values.yaml

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "chore(gitops): update image tag to ${IMAGE_TAG} [skip ci]"

      - name: Push Changes
        run: |
          git push origin test
